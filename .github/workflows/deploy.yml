name: app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'main.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'data/processed/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  # Kept in sync with infra/main.bicep's CAF-based naming — see infra.yml.
  AZURE_RESOURCE_GROUP: rg-silmarillion-prod-cac-001
  CONTAINER_APP_NAME: ca-silmarillion-app-prod-cac-001
  ACR_NAME: crsilmarillionprodcac001
  IMAGE_NAME: crsilmarillionprodcac001.azurecr.io/silmarillion-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Roll out new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"
